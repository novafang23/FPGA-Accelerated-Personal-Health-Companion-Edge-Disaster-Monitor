name: CI

on:
  push:
    branches: [ main, 'novafang23-codebase-analysis' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential gcc make python3-venv python3-pip clang-format cppcheck verilator iverilog
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint C code (clang-format check)
        run: |
          echo "Checking C formatting"
          find SIH -name '*.c' -o -name '*.h' | xargs -r clang-format --Werror -n || true

      - name: Python lint (flake8)
        run: |
          echo "Running flake8"
          flake8 SIH/ || true

      - name: Compile C sources (smoke check)
        working-directory: SIH
        run: |
          echo "Compiling C sources to object files"
          gcc -Wall -Wextra -std=c11 -c *.c || (echo "C compilation failed" && exit 1)

      - name: Run cppcheck (C static analysis)
        working-directory: SIH
        run: |
          cppcheck --enable=all --inconclusive --quiet --output-file=../cppcheck-report.txt . || true

      - name: Run Verilog lint (verilator) if available
        run: |
          files=$(find SIH -name "*.v" -print)
          if [ -n "$files" ]; then
            for f in $files; do
              echo "Linting $f"
              verilator --lint-only --outf ${f##*/}-verilator.txt $f 2>> verilator-report.txt || true
            done
          else
            echo "No Verilog files found"
          fi

      - name: Build and run unit tests (SIH)
        working-directory: SIH
        run: |
          echo "Compiling and running unit tests"
          gcc -I. -std=c11 -Wall -Wextra disaster_risk_engine.c tests/test_disaster_risk.c -o tests/run_disaster_tests.exe || (echo "Test build failed" && exit 1)
          chmod +x tests/run_disaster_tests.exe || true
          tests/run_disaster_tests.exe || (echo "Unit tests failed" && exit 1)

      - name: Archive reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            SIH/*.o
            cppcheck-report.txt
            verilator-report.txt
            SIH/*-verilator.txt
