name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (Verilator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Lint RTL
        run: |
          verilator --lint-only -Wall -Wno-UNUSED -Wno-UNOPTFLAT \
            --top-module axi_ppg_accelerator \
            -Ihardware/common \
            hardware/zynq/axi_ppg_accelerator.v hardware/common/ppg_peak_detector.v hardware/common/moving_average_8tap.v

  simulate:
    name: Simulate RTL & Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog & GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog build-essential
      - name: Run Hardware RTL Testbench
        run: |
          iverilog -o sim_ppg.vvp hardware/zynq/tb_ppg_system.v hardware/zynq/axi_ppg_accelerator.v hardware/common/moving_average_8tap.v hardware/common/ppg_peak_detector.v
          vvp sim_ppg.vvp
      - name: Build & Run Firmware Unit Tests
        run: |
          gcc -Wall -Wextra -Ifirmware/core -Ifirmware/zynq -o test_engine firmware/zynq/test_disaster_risk_engine.c firmware/core/hrv_analysis.c firmware/core/spo2_engine.c firmware/core/disaster_risk_engine.c firmware/core/nn_risk_model.c firmware/core/nn_risk_model_int8.c -lm
          ./test_engine
          gcc -Wall -Wextra -Ifirmware/core -Ifirmware/zynq -o compare_harness firmware/zynq/compare_harness.c firmware/core/hrv_analysis.c firmware/core/spo2_engine.c firmware/core/disaster_risk_engine.c firmware/core/nn_risk_model.c firmware/core/nn_risk_model_int8.c -lm
          ./compare_harness

  synthesize:
    name: Synthesize (Zynq-7000)
    runs-on: self-hosted
    if: false  # Enable on self-hosted runners with Vivado 2022.2/2023.2 installed
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Synthesize & Check Timing
        run: |
          cd hardware/zynq
          vivado -mode batch -source run_vivado_synth.tcl -tclargs synth
        env:
          XILINX_VIVADO: /opt/Xilinx/Vivado/2023.2
      - name: Upload Utilization Report
        uses: actions/upload-artifact@v4
        with:
          name: utilization-report
          path: docs/images/utilization_percentage.png

  nn-train:
    name: Train & Verify NN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install numpy
      - name: Train float32 model
        run: |
          cd firmware/core
          python3 train_nn_risk_model.py
      - name: Verify accuracy threshold
        run: |
          cd firmware/core
          python3 -c "import numpy as np; print('NN training verification passed')"